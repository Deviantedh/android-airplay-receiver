apply plugin: 'com.android.application'

android {
    compileSdkVersion 19          // android.jar for API 19 covers API 10 targets fine
    buildToolsVersion "28.0.3"

    defaultConfig {
        applicationId "com.splendid.airplay"
        minSdkVersion  10
        targetSdkVersion 10

        // Tell AGP we have no NDK build – we pre-built libairplay_core.so manually
        ndk {
            abiFilters "armeabi-v7a"
        }
    }

    // NO externalNativeBuild block – .so is pre-built by build.sh and placed in jniLibs

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            jniDebuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            java.srcDirs     = ['src/main/java']
            res.srcDirs      = ['src/main/res']
            // Prevent Gradle from trying to invoke ndk-build on its own
            jni.srcDirs      = []
            // Pick up pre-built .so from here
            jniLibs.srcDirs  = ['src/main/libs']
        }
    }

    packagingOptions {
        doNotStrip "*/armeabi-v7a/*.so"
    }
}

dependencies {
    // No external dependencies – fully self-contained
}
